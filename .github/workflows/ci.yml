name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate --registry=https://registry.npmjs.org

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build and verify extension
        run: npm run build

      - name: Install Playwright Chromium and system dependencies
        run: node node_modules/playwright/cli.js install --with-deps chromium --no-shell

      - name: End-to-end tests
        id: e2e
        run: npm run test:e2e

      # Only synthetic fixture screenshots; traces can contain source code.
      - name: Upload screenshots from failed E2E run
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 3
